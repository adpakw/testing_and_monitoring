services:
  mlflow_example:
    build:
      context: ./
      dockerfile: ./Dockerfile
    image: ml_service:$USER
    container_name: ml_service_$USER
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - 1488:8890
    environment:
      - MLFLOW_TRACKING_URI=http://158.160.2.37:5000/
      - DEFAULT_RUN_ID=${DEFAULT_RUN_ID}
      - EVIDENTLY_URL=http://158.160.2.37:8000/
      - EVIDENTLY_PROJECT_ID=019d061f-cc08-7b5e-b932-d792a1f258e2
      - DRIFT_INTERVAL_SECONDS=300
      - DRIFT_MIN_SAMPLES=100
    command: uvicorn main:app --host 0.0.0.0 --port 8890

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_$USER
    ports:
      - "9090:9090"
    depends_on:
      - mlflow_example
